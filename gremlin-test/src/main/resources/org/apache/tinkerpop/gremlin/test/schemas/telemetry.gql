/* tag::schema[] */
(:site => { name :: STRING NOT NULL, region :: STRING }),
(:device => { serial :: UUID NOT NULL, model :: STRING, firmware :: BYTES /* BINARY */, online :: BOOLEAN,
              uptime :: DURATION, installed :: ZONED DATETIME }),
(:sensor => { kind :: STRING, unit :: STRING, status :: INT8 /* BYTE */, errors :: INT16 /* SHORT */ }),
(:reading => { value :: FLOAT32 /* FLOAT */, at :: ZONED DATETIME }),
(:site)-[:hosts]->(:device) /* containment */,
(:device)-[:uplinksTo { latency :: DOUBLE }]->(:device) /* hierarchy */,
(:device)-[:has]->(:sensor) /* containment */,
(:sensor)-[:recorded]->(:reading) /* containment */
/* end::schema[] */

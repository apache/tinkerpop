# Sample configuration for a durable, transactional TinkerStorageGraph on Gremlin Server. Reference it from the
# server's "graphs" block, for example in gremlin-server-transaction.yaml:
#   graphs: { graph: conf/tinkerstoragegraph-persistent.properties }
gremlin.graph=org.apache.tinkerpop.gremlin.tinkergraph.structure.TinkerStorageGraph

# Enables durable persistence. "graphbinary" is the built-in storage engine; the fully qualified class name of a
# custom TinkerStorage implementation may be used instead. Without this key the graph is transactional but in-memory.
gremlin.tinkergraph.storage=graphbinary
# Directory holding the durable data. Required when a storage engine is set. It is created if absent and may be
# opened by only one graph at a time (single writer, whether in this JVM or another process).
gremlin.tinkergraph.storage.directory=/tmp/tinkerstoragegraph

gremlin.tinkergraph.vertexIdManager=LONG
gremlin.tinkergraph.edgeIdManager=LONG
gremlin.tinkergraph.vertexPropertyIdManager=LONG

# Optional storage tuning (defaults shown, uncomment to change):
# "commit" forces each transaction to disk (survives OS crash/power loss); "os" is faster but survives only a JVM crash
#gremlin.tinkergraph.storage.sync=commit
# auto-compact the append log once it grows past this many bytes (default 67108864 = 64MB; 0 disables)
#gremlin.tinkergraph.storage.compactThreshold=67108864
# persist auto-generated vertex-property ids across a reopen (default false)
#gremlin.tinkergraph.storage.preserveVertexPropertyIds=false

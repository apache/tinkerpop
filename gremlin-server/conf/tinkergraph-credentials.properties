gremlin.graph=org.apache.tinkerpop.gremlin.tinkergraph.structure.TinkerGraph
gremlin.tinkergraph.vertexIdManager=LONG
# This credential store is an in-memory TinkerGraph. TinkerGraph no longer auto-loads from disk on open, so
# SimpleAuthenticator reads the store explicitly from graphLocation using graphFormat at startup. Both keys are
# retired as TinkerGraph settings and are honoured only for this load; they name an interchange FILE, not the
# storage DIRECTORY that a durable TinkerStorageGraph configures with gremlin.tinkergraph.storage.directory.
gremlin.tinkergraph.graphLocation=data/credentials.kryo
gremlin.tinkergraph.graphFormat=gryo
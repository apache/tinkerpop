<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --panel: #f6f8fa;
  --good: #1a7f37; --bad: #cf222e; --warn: #9a6700; --accent: #0969da;
  --pass: #2da44e; --wrong: #cf222e; --runtime: #e16f24; --parse: #8250df; --none: #8c959f; --timeout: #bf8700;
  --declined: var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --panel: #161b22;
    --good: #3fb950; --bad: #f85149; --warn: #d29922; --accent: #4493f8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 32px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
p.note, .muted { color: var(--muted); }
code, pre { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; margin: 12px 0; }
dl.meta dt { color: var(--muted); }
dl.meta dd { margin: 0; overflow-wrap: anywhere; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rate { display: inline-block; min-width: 52px; padding: 1px 6px; border-radius: 4px; text-align: right;
  font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 12px; }
.banner { border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; padding: 8px 12px; margin: 16px 0; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; font-size: 12px; color: var(--muted); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
details.scenario { border-bottom: 1px solid var(--line); }
details.scenario > summary { cursor: pointer; padding: 6px 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
details.scenario > summary .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
  flex: 1 1 320px; overflow-wrap: anywhere; }
details.scenario > div { padding: 4px 12px 12px 20px; }
.cells { display: flex; gap: 4px; }
.cells > span { width: 84px; text-align: center; }
.cells.head > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
.scenario-head { display: flex; justify-content: flex-end; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.attempt { margin: 8px 0 0; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.tag.PASS { color: var(--pass); border-color: var(--pass); }
.tag.WRONG_RESULT, .tag.COINCIDENTAL, .tag.STATE_MISMATCH { color: var(--wrong); border-color: var(--wrong); }
.tag.RUNTIME_ERROR { color: var(--runtime); border-color: var(--runtime); }
.tag.PARSE_FAILURE { color: var(--parse); border-color: var(--parse); }
.tag.TIMEOUT { color: var(--timeout); border-color: var(--timeout); }
.tag.DECLINED { color: var(--declined); border-color: var(--declined); }
.copy { display: none; font: 11px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px;
  margin-left: 4px; cursor: pointer; vertical-align: 1px; }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.js .copy { display: inline-block; }
svg text { fill: var(--muted); font-size: 10px; }
svg .axis { stroke: var(--line); } svg .zero { stroke: var(--muted); stroke-dasharray: 2 2; }
svg .ci { stroke: var(--accent); stroke-width: 2; } svg .point { fill: var(--accent); }
</style>
</head>
<body>
<main>
{{body}}
</main>
<script>
// copies a scenario name without opening or closing its details; the buttons stay hidden if scripts do not run
document.documentElement.classList.add("js");
document.addEventListener("click", function (event) {
  var button = event.target.closest("button.copy");
  if (!button) return;
  event.preventDefault();
  var done = function () {
    button.textContent = "copied";
    setTimeout(function () { button.textContent = "copy"; }, 1200);
  };
  var text = button.getAttribute("data-copy");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done);
  } else {
    var area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    if (document.execCommand("copy")) done();
    area.remove();
  }
});
</script>
</body>
</html>

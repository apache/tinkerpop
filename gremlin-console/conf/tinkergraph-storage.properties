# Sample configuration for a durable, transactional TinkerStorageGraph. Opening a graph with this configuration
# (for example via GraphFactory) produces a TinkerStorageGraph that persists committed transactions to graphLocation.
gremlin.graph=org.apache.tinkerpop.gremlin.tinkergraph.structure.TinkerStorageGraph

# built-in storage engine; without this key the graph is transactional but in-memory only
gremlin.tinkergraph.storage=graphbinary
# directory holding the durable data (created if absent; a location may be opened by only one graph at a time)
gremlin.tinkergraph.graphLocation=/tmp/tinkergraph
